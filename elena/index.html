<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elena Mirón - Digital Business Card</title>
    <meta name="description" content="Elena Mirón, VP of Delivery, Strategy &amp; Solutions — EU Region at USDM Life Sciences. Expert in GxP compliance, digital quality, and regulatory solutions for life sciences.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3a5f 0%, #2c5282 50%, #4a90a4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .business-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            max-width: 420px;
            width: 100%;
            padding: 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .business-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #1e3a5f, #4a90a4);
        }

        .profile-image {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            margin: 0 auto 25px;
            display: block;
            object-fit: cover;
            border: 4px solid #4a90a4;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .company-logo {
            position: absolute;
            top: 20px;
            right: 25px;
            width: 70px;  /* Adjust this to make it smaller/larger */
            height: auto;
            object-fit: cover;
        }

        .name {
            font-size: 32px;
            font-weight: 700;
            color: #1e3a5f;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .title {
            font-size: 18px;
            color: #4a90a4;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .company {
            font-size: 20px;
            color: #1e3a5f;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .bio {
            font-size: 15px;
            color: #5a6c7d;
            line-height: 1.6;
            margin-bottom: 35px;
            padding: 0 10px;
        }

        .contact-info {
            margin-bottom: 35px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            font-size: 15px;
            color: #2c5282;
        }

        .contact-item svg {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            fill: #4a90a4;
        }

        .contact-item a {
            color: #1e3a5f;
            text-decoration: none;
            font-weight: 500;
        }

        .contact-item a:hover {
            color: #4a90a4;
            text-decoration: underline;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 35px;
        }

        .social-link {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 2px solid #e2e8f0;
        }

        .social-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .social-link svg {
            width: 22px;
            height: 22px;
            fill: #5a6c7d;
        }

        .linkedin:hover {
            background: #0077b5;
            border-color: #0077b5;
        }
        .linkedin:hover svg { fill: white; }

        .website:hover {
            background: #1e3a5f;
            border-color: #1e3a5f;
        }
        .website:hover svg { fill: white; }

        .email:hover {
            background: #4a90a4;
            border-color: #4a90a4;
        }
        .email:hover svg { fill: white; }

        .actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 18px;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1e3a5f, #4a90a4);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(30, 58, 95, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #1e3a5f;
            border: 2px solid #1e3a5f;
        }

        .btn-secondary:hover {
            background: #1e3a5f;
            color: white;
            transform: translateY(-2px);
        }

        .specialty-badge {
            display: inline-block;
            background: linear-gradient(135deg, #4a90a4, #1e3a5f);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .specialties {
            margin: 20px 0;
            text-align: center;
        }

        @media (max-width: 480px) {
            .business-card {
                padding: 30px 25px;
                margin: 10px;
            }

            .name {
                font-size: 26px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }

        .fade-in {
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .usdm-accent {
            position: absolute;
            bottom: 20px;
            right: 25px;
            opacity: 0.1;
            font-size: 10px;
            color: #1e3a5f;
            font-weight: bold;
        }
        /* fallback: stack children vertically */
        body {
          display: flex;
          flex-direction: column;   /* add this */
          gap: 24px;
          justify-content: center;
          align-items: center;
        }
    </style>
</head>
